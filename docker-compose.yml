services:
  quipu:
    build:
      context: .
      dockerfile: Dockerfile
    image: quipu-observer:dev
    container_name: quipu
    ports:
      - "127.0.0.1:7100:7100"
    environment:
      SCB_DB_PATH: /data/local_brain.sqlite
      QUIPU_TRAIN_INTERVAL: "45"
      QUIPU_TRAIN_BUDGET: "8"
      QUIPU_HIDEOUT_HOST: scbrain-hideout
      QUIPU_HIDEOUT_MESH: hideout-mesh
      QUIPU_HIDEOUT_TUNNEL: scbrain-hideout.use2
      QUIPU_EDGE_AUTH: "${QUIPU_EDGE_AUTH:-record}"
      QUIPU_EDGE_BUDGET: "${QUIPU_EDGE_BUDGET:-record}"
      QUIPU_EDGE_KEYS_FILE: /run/quipu-edge/edge_keys.json
      QUIPU_EDGE_GRANT_FILE: /run/quipu-edge/edge_grant.json
    volumes:
      - quipu_brain:/data
      - ./bridge_state:/app/bridge_state
      # Edge keys and grant, read-only, from outside the repository (qpsi.edge_admission).
      - ${QUIPU_EDGE_DIR:-./docs/edge-empty}:/run/quipu-edge:ro
    restart: unless-stopped

volumes:
  quipu_brain:
