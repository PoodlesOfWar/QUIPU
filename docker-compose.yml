services:
  quipu:
    build:
      context: .
      dockerfile: Dockerfile
    image: quipu-observer:dev
    container_name: quipu
    ports:
      - "127.0.0.1:7100:7100"
    environment:
      SCB_DB_PATH: /data/local_brain.sqlite
      QUIPU_TRAIN_INTERVAL: "45"
      QUIPU_TRAIN_BUDGET: "8"
      QUIPU_HIDEOUT_HOST: scbrain-hideout
      QUIPU_HIDEOUT_MESH: hideout-mesh
      QUIPU_HIDEOUT_TUNNEL: scbrain-hideout.use2
    volumes:
      - quipu_brain:/data
      - ./bridge_state:/app/bridge_state
    restart: unless-stopped

  quipu-game-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.game
    image: quipu-game-pipeline:dev
    container_name: quipu-game-pipeline
    ports:
      - "127.0.0.1:7200:7200"
    environment:
      SCB_DB_PATH: /data/local_brain.sqlite
      GAME_PIPELINE_PORT: "7200"
      GAME_PIPELINE_HOST: "0.0.0.0"
    volumes:
      - quipu_brain:/data
      - ./quipu_learned_artifacts:/app/quipu_learned_artifacts
    restart: unless-stopped

  quipu-video-trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    image: quipu-video-trainer:dev
    container_name: quipu-video-trainer
    ports:
      - "127.0.0.1:7250:7250"
    environment:
      SCB_DB_PATH: /data/local_brain.sqlite
      TRAINER_PORT: "7250"
      TRAINER_HOST: "0.0.0.0"
      RECORDINGS_DIR: "/app/recordings"
      QUIPU_ARTIFACT_DIR: "/app/quipu_learned_artifacts"
    volumes:
      - quipu_brain:/data
      - ./recordings:/app/recordings
      - ./quipu_learned_artifacts:/app/quipu_learned_artifacts
    restart: unless-stopped

  quipu-game-osrs:
    build:
      context: .
      dockerfile: Dockerfile.osrs
    image: quipu-game-osrs:dev
    container_name: quipu-game-osrs
    ports:
      - "127.0.0.1:7310:7310"
    environment:
      OSRS_PORT: "7310"
      OSRS_HOST: "0.0.0.0"
      OSRS_DIR: "/games/osrs"
      TAILSCALE_AUTHKEY: "tskey-auth-kQUIPU-2026-MESH-V1"
      TAILSCALE_TAILNET: "quipu.mesh"
      TAILSCALE_OVERLAY_IP: "100.64.0.10"
      TAILSCALE_HOSTNAME: "osrs.quipu.mesh"
    volumes:
      - osrs_game_data:/games/osrs
      - ./src:/app/src:ro
    restart: unless-stopped

  quipu-game-wow:
    build:
      context: .
      dockerfile: Dockerfile.wow
    image: quipu-game-wow:dev
    container_name: quipu-game-wow
    ports:
      - "127.0.0.1:7320:7320"
    environment:
      WOW_PORT: "7320"
      WOW_HOST: "0.0.0.0"
      WOW_DIR: "/games/wow"
      TAILSCALE_AUTHKEY: "tskey-auth-kQUIPU-2026-MESH-V1"
      TAILSCALE_TAILNET: "quipu.mesh"
      TAILSCALE_OVERLAY_IP: "100.64.0.20"
      TAILSCALE_HOSTNAME: "wow.quipu.mesh"
    volumes:
      - wow_game_data:/games/wow
      - ./src:/app/src:ro
    restart: unless-stopped

  quipu-game-gw:
    build:
      context: .
      dockerfile: Dockerfile.gw
    image: quipu-game-gw:dev
    container_name: quipu-game-gw
    ports:
      - "127.0.0.1:7330:7330"
    environment:
      GW_PORT: "7330"
      GW_HOST: "0.0.0.0"
      GW_DIR: "/games/gw"
      TAILSCALE_AUTHKEY: "tskey-auth-kQUIPU-2026-MESH-V1"
      TAILSCALE_TAILNET: "quipu.mesh"
      TAILSCALE_OVERLAY_IP: "100.64.0.30"
      TAILSCALE_HOSTNAME: "gw.quipu.mesh"
    volumes:
      - gw_game_data:/games/gw
      - ./src:/app/src:ro
    restart: unless-stopped

volumes:
  quipu_brain:
  osrs_game_data:
  wow_game_data:
  gw_game_data:

