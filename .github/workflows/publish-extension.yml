name: Publish x_ProcessStudio extension (VS Code Marketplace + Open VSX)

# Tag `ext-v<version>` (matching extensions/vscode-x-process-studio/package.json)
# to package and publish. Each store publishes only when its token secret is
# set, so the workflow is safe to run before either account exists:
#   VSCE_PAT — Azure DevOps PAT (Marketplace > Manage) for publisher `poodlesofwar`
#   OVSX_PAT — open-vsx.org access token for namespace `poodlesofwar`
# The .vsix is always attached to the run (and to the GitHub release on tags).

on:
  push:
    tags: ['ext-v*']
    paths: ['extensions/vscode-x-process-studio/**']
  pull_request:
    paths: ['extensions/vscode-x-process-studio/**', '.github/workflows/publish-extension.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode-x-process-studio
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/vscode-x-process-studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          want="ext-v$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "$want" || { echo "tag ${GITHUB_REF_NAME} != $want"; exit 1; }

      - name: Package .vsix
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: x-process-studio-vsix
          path: extensions/vscode-x-process-studio/*.vsix

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/ext-v') && env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --skip-license --packagePath *.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/ext-v') && env.OVSX_PAT != ''
        run: npx ovsx publish --packagePath *.vsix --skip-duplicate -p "$OVSX_PAT"

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/ext-v')
        uses: softprops/action-gh-release@v2
        with:
          files: extensions/vscode-x-process-studio/*.vsix
